name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Go to android-agent folder
      run: cd android-agent

    - name: Grant execute permission for gradlew
      run: chmod +x android-agent/gradlew

    - name: Build Debug APK
      run: ./android-agent/gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android-agent/app/build/outputs/apk/debug/*.apk
